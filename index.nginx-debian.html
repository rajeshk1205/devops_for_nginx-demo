<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* Header */
header {
    background: #2c3e50;
    color: white;
    padding: 20px;
    text-align: center;
}

/* Navigation */
nav {
    background: #34495e;
    text-align: center;
    padding: 10px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
    cursor: pointer;
}

nav a:hover {
    color: #f1c40f;
}

/* Sections */
.section {
    display: none;
    padding: 60px 20px;
    text-align: center;
}

.active {
    display: block;
}

/* Login Form */
form {
    background: white;
    padding: 30px;
    width: 300px;
    margin: auto;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 10px;
    background: #3498db;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #2980b9;
}

/* Footer */
footer {
    background: #2c3e50;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>My Website</h1>
</header>

<nav>
    <a onclick="showHome()">Home</a>
    <a onclick="showLogin()">Login</a>
</nav>

<!-- Home Section -->
<div id="home" class="section active">
    <h2>Welcome 👋</h2>
    <p>This is the homepage of the website.</p>
</div>

<!-- Login Section -->
<div id="login" class="section">
    <h2>Login Page</h2>
    <form>
        <input type="text" placeholder="Enter Login ID" required>
        <input type="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>
</div>

<footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
</footer>

<script>
function showHome() {
    document.getElementById("home").classList.add("active");
    document.getElementById("login").classList.remove("active");
}

function showLogin() {
    document.getElementById("login").classList.add("active");
    document.getElementById("home").classList.remove("active");
}
</script>

</body>
</html>
